name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'penalty-shoot-world-cup-deluxe.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract game project
        run: |
          mkdir game
          unzip -o penalty-shoot-world-cup-deluxe.zip -d game

      - name: Install dependencies and generate Android project
        working-directory: game
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: game/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: penalty-shoot-world-cup-debug-apk
          path: game/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
